[project]
name = "python-polsen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matt Moore", email = "matt.d.moore@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "certifi>=2026.7.22",
    "dotenv>=0.9.9",
    "yarl>=1.25.1",
]

[project.scripts]
python-polsen = "python_polsen:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint.pydocstyle]
convention = "google"
