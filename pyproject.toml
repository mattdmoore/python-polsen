[project]
name = "python-polsen"
version = "0.2.0"
license = "MIT"
license-files = [
    "LICENSE"
]
description = "An asynchronous Python client for the [Polsen Health API](https://docs.research-api.nowatch.com/), the service exposing physiological and contextual data collected by Polsen devices and processed by the Polsen App for scientific and research use."
readme = "README.md"
authors = [
    { name = "Matt Moore", email = "matt.d.moore@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "certifi>=2026.7.22",
    "dotenv>=0.9.9",
    "yarl>=1.25.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
